    <main>
        <h2>Entre em Contato</h2>

        <p>Você irá nos encontrar todos os dias de tarde na sala de estudos do curso de Análise e Desenvolvimento de
            Sistemas do IFPE / Campus Recife</p>
        <section>
            <form action="">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" maxlength="200" rows="4" cols="50"></textarea>
                <input type="submit" name="Enviar" id="submit_button" class="button">
            </form>

            <img src="assets/images/contact/mapa.png" alt="">
        </section>
    </main>
